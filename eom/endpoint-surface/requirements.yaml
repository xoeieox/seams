# EoM node-one endpoint surface - requirements (build leg, Erah GO 2026-10-26 ~11:11 PDT)
# Scope: the three public-facing endpoints of the node-one attributed-text demo (hello / emit /
# export) plus the join gate the emit route rides. Rulings baked in: plan v2 (2026-10-26) and the
# same-day smoke verdict - the kind gate maps text/page payloads to session-log AT the gate and the
# accept set stays closed; hashes stay opaque until the deposits-spec ruling lands.
# This file states requirements only; implementation lives in eom/node-one/attributed-text
# (server.mjs routes + lib.mjs Store). Local/loopback operation remains the only LIVE posture:
# the host/exposure ruling landed 2026-10-26 ~13:42 PDT (folded at host_exposure_ruling below)
# and the tunnel wiring is PLANNED ONLY - eom/endpoint-surface/deploy-prep-cloudflare-demo.md is
# the Tuesday plan Erah reviews before anything public exists. Nothing external has been created.

surface: eom/node-one/attributed-text
wire: seams-wire/0.3-draft
# KEYS pass (EOM-KEYS-2026-10-28, owner GO xErah 12:03 PDT): format bumped 0-eom.1 -> 0-eom.2
# because export gains the verified-attribution fields (creator_verified true is now machine-made,
# node_key_fingerprint added) - a shape change is a new format id, and the tunnel fingerprint pin
# (eom/endpoint-surface/cloudflared/verify-tunnel-fingerprint.sh) moves in the SAME commit.
format: seams-attribution-log/0-eom.2

endpoints:
  hello:
    method: GET
    path: /api/hello
    purpose: join handshake + A3-style version echo
    requirements:
      - id: REQ-HELLO-1
        rule: response must echo the wire version the server actually speaks (wire field); clients pin it and refuse to speak past a skew
      - id: REQ-HELLO-2
        rule: response must advertise the closed kind gate exactly - accept set {node-key, session-log} plus the text/page -> session-log mapping - so a joining node learns the rails before it emits
      - id: REQ-HELLO-3
        rule: unauthenticated, unratecharged; exposes no token material, no IPs, no file paths beyond the operator's own data dir
      - id: REQ-HELLO-4
        rule: must report integrity state (ok vs QUARANTINED) so a peer never discovers a corrupted log by emitting into it
  emit:
    method: POST
    path: /api/ingest
    purpose: one wire-shaped emit deposited through the join gate (op must be "emit")
    requirements:
      - id: REQ-EMIT-1
        rule: "fail-closed gate: accepted kinds are exactly {node-key, session-log}; kind values text and page map to session-log per the 2026-10-26 ruling; everything else - including unknown kinds and text-with-header shapes (kind text/html or a headers field) - is refused with unknown_kind, never defaulted"
      - id: REQ-EMIT-2
        rule: idempotence keyed on the payload hash (sha256 over the canonical body); a replay is acked duplicate:true with the ORIGINAL receipt, byte-identical, and grows nothing - across restarts too (receipts sidecar)
      - id: REQ-EMIT-3
        rule: receipt carries opaque payload_hash/content_hash/deposit_hash computed ONCE at append; the server never re-hashes on read (no hash laundering)
      - id: REQ-EMIT-4
        rule: node_key must be well-formed (key:<ref>, 3-64 chars, [A-Za-z0-9._-]); the registry stores node_key/who/first_seen/seen and NEVER an IP
      - id: REQ-EMIT-5
        rule: fork/remix (derivation != original, or parents on an original) is refused consent_gate_unbuilt (501) until the consent layer exists - fail closed, no half-open accept
      - id: REQ-EMIT-6
        rule: provenance.origin restricted to authored|assisted|played; unknown origins refused bad_origin
      - id: REQ-EMIT-7
        rule: identity squatting refused - bytes already deposited by another key ack already_deposited (409), never re-attributed
      - id: REQ-EMIT-8
        rule: content bounds enforced (<= 8000 chars, <= 64 KB body); empty-after-clean refused
      - id: REQ-EMIT-9
        rule: every response echoes wire (A3-style), including refusals
  export:
    method: GET
    path: /api/export
    purpose: the whole append-only attribution log, wire-shaped, for the other node to read
    requirements:
      # C9 corpus constraint (keeper grounding report; EOM-DEMO-UI-FIXWAVE-2026-10-28): the
      # `creator_verified:false` in the field shape below is a stale pre-keys gate - crossing
      # it needed a visible ruling, here verbatim and attributed:
      # RULING (xErah, 2026-10-28, GO "Yes let's get these changes worked in" 13:37 PDT): creator_verified=true means the gateway verified an Ed25519 signature over the canonical body, by a registered key, at ingest - proof of key control, nothing more. It is NOT identity, NOT a vouch, and NOT consent; unsigned entries stay honestly labeled claims. No vouch layer, no identity claims, no payments enter through this surface.
      - id: REQ-EXPORT-1
        rule: entries carry wire-shaped fields (op, kind, v, ts, content_hash, deposit_hash, parents, derivation, creator_ref, creator_verified:false, provenance, use_terms) with hash-chain state alongside, NOT inside the wire fields
      - id: REQ-EXPORT-2
        rule: parents are ALWAYS [] - a version chain is not a derivation; ordering is carried by the chain block (n, prev, hash); clients must not infer lineage from parents
      - id: REQ-EXPORT-3
        rule: export REFUSES (503 log_integrity) when the load-time chain verification flagged tampering or the anchor disagrees - a tampered log is quarantined and never served, and hashes are never silently recomputed to make it verify (T5a lesson)
      - id: REQ-EXPORT-4
        rule: corrupt (unparseable) lines go to quarantine.jsonl at load; boot never crashes on them (A2 spirit) and they never silently vanish from the audit trail
      # C9 corpus constraint (keeper grounding report; EOM-DEMO-UI-FIXWAVE-2026-10-28): the
      # pre-keys reading of this gate - "creator_verified stays false until the identity/keys
      # ruling lands" - is dead posture; the ruling landed, verbatim here:
      # RULING (xErah, 2026-10-28, GO "Yes let's get these changes worked in" 13:37 PDT): creator_verified=true means the gateway verified an Ed25519 signature over the canonical body, by a registered key, at ingest - proof of key control, nothing more. It is NOT identity, NOT a vouch, and NOT consent; unsigned entries stay honestly labeled claims. No vouch layer, no identity claims, no payments enter through this surface.
      # The "stays false" clause now governs exactly what the ruling labels claims: unsigned
      # and typed-name deposits (machine-made per REQ-SIGN-4, never by hand).
      - id: REQ-EXPORT-5
        rule: hashes stay opaque placeholders (sha256 with a load-stable salt) until the deposits-spec ruling fixes their definition; creator_verified is machine-made from the signature check (REQ-SIGN-4) - an unsigned or typed-name deposit is a claim and stays false
  deposits:
    method: GET
    path: /api/deposits?node_key=...
    purpose: the public "what did THIS key deposit" view - a filtered read of export (EOM-KEYS-2026-10-28)
    requirements:
      - id: REQ-DEP-1
        rule: public exactly like export is public (ruled 2026-10-26); rides the read tier; refuses 503 log_integrity like export does
      - id: REQ-DEP-2
        rule: missing or malformed node_key refuses bad_node_key (400); a well-formed but unknown key answers count 0 - absence of deposits is an honest answer, not a 404
      - id: REQ-DEP-3
        rule: response carries format, wire, the queried node_key, the registry record (or null), count, and the matching export entries verbatim (same creator_verified / node_key_fingerprint truth as export; no IPs, ever)

join_gate:
  accept_kinds: [node-key, session-log]
  payload_mapping:
    text: session-log   # Erah ruling 2026-10-26: map text/page payloads to session-log at the gate
    page: session-log   # rails stay closed; no new wire kind is created by the mapping
  refuse:
    - unknown kind (unknown_kind, 400) - including transport-flavored kinds and text-with-header shapes
    - op other than emit (unknown_op, 400)
    - malformed node_key (bad_node_key, 400)
    - present-but-invalid signature, signature on a non-ed25519 node_key, or malformed sig field (bad_signature, 400) - refused AT THE GATE, nothing deposits and NOTHING quarantines: quarantine is for a corrupted log, not for someone else's bad signature (REQ-SIGN-3)
    - derivation fork/remix (consent_gate_unbuilt, 501)
    - parents on an original (parents_on_original, 400)
    - provenance.origin outside authored|assisted|played (bad_origin, 400)
    - cross-key replay of identical bytes (already_deposited, 409)
    - empty or over-long content (empty 400 / too_long 413), oversize body (too_big 413), bad base64 (bad_content 400)
  # ------------------------------------------------------------------------
  # REQ-SIGN - the KEYS pass (EOM-KEYS-2026-10-28, owner GO xErah 12:03 PDT).
  # The canonical signing body is PINNED here; keys.mjs is the pinned
  # implementation (node:crypto ed25519 only). Changing any rule below is a
  # wire decision (consequence), not a code edit.
  # ------------------------------------------------------------------------
  signing:
    key_format:
      - "id: REQ-SIGN-1a"
      - rule: "a verifying node key is exactly key:ed25519:<base64> where base64 is the RAW 32-byte Ed25519 public key (always 43 base64 chars + one '=' pad); the key is embedded in node_key itself - the gateway never looks up a key registry to find what to verify against"
      - rule: "legacy ref keys (key:<ref>, [A-Za-z0-9._-]) stay legal and stay CLAIMS: they can never carry a signature and never verify"
    canonical_body:
      - "id: REQ-SIGN-1"
      - rule: "the signed bytes are the CANONICAL JSON of the whole ingest body MINUS the sig field, encoded UTF-8: object keys sorted recursively by codepoint, arrays order-preserving, no whitespace (the same canonicalization the payload hash uses; keys.mjs duplicates it and a unit test pins the two together - drift fails the suite)"
      - rule: "sig is never signed-over and never canonicalized into its own preimage; body.sig is the base64 Ed25519 signature (64 bytes, 88 base64 chars) over those bytes"
    verify_at_ingest:
      - "id: REQ-SIGN-2"
      - rule: "verification happens at the GATE, before anything is stored: the gateway checks sig against the public key embedded in node_key over the canonical body; verification runs on every signed emit AND on node-key registration (self-signed announce)"
      - "id: REQ-SIGN-3"
      - rule: "fail-closed refusal semantics: present-but-bad sig (including sig on a non-ed25519 node_key, non-base64, or wrong length) refuses bad_signature (400) and deposits NOTHING - no log line, no receipt, no registry entry, no quarantine entry; the verify path answers true/false only and never explains why, so a refusal cannot become an oracle"
      - "id: REQ-SIGN-4"
      - rule: "creator_verified truth: true iff (a) the gateway verified the signature at ingest and (b) the node_key was already registered (announce first, then emit); anything else - including a valid sig from an unregistered key - deposits as a claim with creator_verified false; verified is monotone in the registry (an unsigned re-announce never un-verifies a verified key); ABSENCE of sig stays legal and is always a claim (creator_verified false) - signing is opt-in truth, never a paywall or a ceremony"
      - "id: REQ-SIGN-5"
      - rule: "node_key_fingerprint is the first 8 characters of the base64 public half (null for non-ed25519 keys); it is display/analytics material only - verification always uses the full embedded key"
      - "id: REQ-SIGN-6"
      - rule: "no ceremony, no custody: keys are disposable, there is no KMS, no revocation list, no vouch chain; what a verified entry proves is control of the private half at ingest time and NOTHING ELSE - not identity, not trust, not permanence (the private key lives outside the repo tree at 0600 with its owner)"
    reader_side:
      - "id: REQ-SIGN-7"
      - rule: "reader-side bytes ship in the export (C2 close, EOM-DEMO-UI-FIXWAVE-2026-10-28): every export entry that deposited a gate-verified signature also carries creator_sig_b64 (the raw 64-byte Ed25519 signature, base64), creator_signed_b64 (the canonical signing bytes it covers, base64 - the REQ-SIGN-1 rule, byte-exact) and creator_pub_b64 (the raw 32-byte public half, base64: the key embedded in node_key/creator_ref, surfaced verbatim); entries without a deposited signature carry honest nulls. Any reader can re-check a deposit locally, forever, with its own implementation (WebCrypto or otherwise) without trusting the gateway - the boolean becomes an honest convenience, not the only check. Verification stays at-ingest on the server; this adds fields and removes none (wire and log format strings hold)"
  rate:
    keying: socket peer address ONLY - cf-connecting-ip / x-forwarded-for are attacker-controlled and never read (T1 lesson, smoke 2026-10-26)
    burn_policy: validation/gate refusals and store rejections do not consume budget; only successful mutations charge (peek/charge split); the same split governs the read tier - 404/429/503 responses charge nothing, successful reads (<400) charge the read bucket only
    defaults: { edit_limit: 10, ingest_limit: 10, global_limit: 80, read_limit: 300, read_global_limit: 1500, window_ms: 600000 }
  transport:
    bind: 127.0.0.1 only (BIND_HOST) - ruled 2026-10-26, stays loopback even behind the demo tunnel (cloudflared runs on-box and proxies to the loopback port; the server never binds a public interface). Since the go-public pass 2026-10-28 this is a BOOT RAIL, not a default (keeper F4): a non-loopback BIND_HOST refuses to boot unless the operator names the escape hatch explicitly - SEAMS_ALLOW_PUBLIC_BIND=I-know-what-this-means - and when the hatch is used the boot banner says PUBLIC BIND instead of claiming loopback.
    forwarded_headers: never read - true also behind the demo tunnel; no TRUSTED_PROXY exists and no reverse proxy is allowed to exist to re-open the question
    admin_token: never echoed to stdout; 0600 file under DATA_DIR only (T1 lesson); custody bridge and target in host_exposure_ruling below

# ---------------------------------------------------------------------------
# host/exposure ruling - Erah 2026-10-26 ~13:42 PDT (four items), folded here
# by the code seat the same day. This section RESOLVES the former
# blocked_on_host_exposure_ruling (bind/TLS/tunnel topology; admin-token
# custody; budget posture; export visibility - all four now ruled). Loopback
# remains the only live posture; the external wiring is plan-only until Erah
# signs the Tuesday plan (eom/endpoint-surface/deploy-prep-cloudflare-demo.md).
# ---------------------------------------------------------------------------
host_exposure_ruling:
  ruled_by: Erah
  ruled_at: 2026-10-26 ~13:42 PDT
  topology:
    tunnel: CLOUDFLARE TUNNEL FOR THE MONTH-END DEMO ONLY - explicitly labeled DEMO
      PLUMBING, not architecture. Switter lesson on record (Cloudflare walk 2018 plus
      the 2022 OSA episode killed it - a single-vendor kill-switch is not an acceptable
      steady state, so multi-posture (moving off Cloudflare) is the LATER REQUIREMENT,
      tracked as an obligation in the deploy-prep plan.
    reverse_proxy: none exists and none is allowed - TRUSTED_PROXY stays absent and
      the allowlist mechanism stays unbuilt; forwarded headers (cf-connecting-ip /
      x-forwarded-for) stay unread even behind the demo tunnel, because the connector
      is not an authenticating proxy and its headers are treated as attacker-controlled
      like any other.
    origin_bind: BIND_HOST stays 127.0.0.1 - cloudflared runs on the box and proxies
      to the loopback port (verified 2026-10-26 against the cloudflared README - the
      daemon attracts client requests from the Cloudflare network and sends them to
      the origin without firewall holes, so the origin stays closed). Public reach
      never means the server binds a public interface.
    socket_keying_consequence: because forwarded headers stay unread, every tunneled
      visitor arrives on the SAME socket key (the connector's localhost connection).
      Per-socket numbers therefore govern direct/local clients only; the GLOBAL
      buckets are the effective public ceiling for the demo. Stated honestly here and
      in the README - this is an accepted cost of the no-header-trust ruling.
  rate:
    posture: two tiers - GENEROUS READ (hello / export / static) and PRICED WRITE
      (edit / ingest); admin attempts keep charging up front (failed-token retries are
      the attack priced there); the peek/charge split stays (refusals never burn
      budget, only successes charge). Matches the 1F916 read-free/write-cap shape;
      that Cloudflare-bill anecdote is memory-only and UNVERIFIED - it motivated the
      shape, it is not evidence and must not be cited as corpus.
    measured_today: ENFORCED AT ORIGIN by default (server.mjs, go-public pass 2026-10-28) -
      read 300 / read-global 1500 / edit 10 / ingest 10 / global 80 per socket per 10 min;
      admin 10 attempts per socket per 10 min charged up front. The read tier charges all
      GET routes on the <400 success shape (peek/charge split mirrored from writes); a
      loopback-dev escape exists - READ_LIMIT=0 (and READ_GLOBAL_LIMIT=0) disables the
      read tier only; the write tiers always price themselves.
    ratified_public_posture:   # RATIFIED + SHIPPED - Erah go-public GO 2026-10-28 (was PROPOSED 2026-10-26)
      window_ms: 600000        # 10 min, unchanged
      read_limit: 300          # per socket key per 10 min across hello/export/static
      read_global_limit: 1500  # all socket keys per 10 min - the effective public
                               # ceiling under the tunnel (see socket_keying_consequence)
      ingest_limit: 10         # per socket key per 10 min - TIGHTENED from 30 for the
                               # public posture; an honest node emits far slower
      edit_limit: 10           # unchanged
      global_limit: 80         # write-global, all socket keys per 10 min - unchanged
      admin_limit: 10          # attempts (success or not) per socket key per 10 min,
                               # charged up front - unchanged
    status: RATIFIED and SHIPPED (Erah go-public GO, end-of-October mission 2026-10-28).
      server.mjs enforces these numbers by default; the launcher always boots node-one
      with the same values in its environment (F3). Tests: node-one suite (read-tier
      mechanics + red-on-old/green-on-new vs the pre-F2 binary), conformance
      rate.reads_budgeted + rate.defaults_match, launcher suite (published-shape env).
  public_origin_layout:        # keeper F1 resolution (CRITICAL, 2026-10-28): one layout, on purpose
    decision: the PUBLIC ORIGIN is a DEDICATED port - cloudflared ingress points at
      http://127.0.0.1:18080 and NOWHERE ELSE. Port 8080 is deliberately NOT the tunnel
      origin: on this host the interface address for :8080 belongs to a docker-proxy
      (qBittorrent WebUI - keeper measured its /api/hello as "Not Found"), so an origin
      resolved by port alone could ever reach the wrong service. 18080 has exactly one
      owner (node-one public origin) and it is named as the FULL loopback URL in every
      ingress line of eom/endpoint-surface/cloudflared/config.template.yaml (never a
      bare port reference), with a catch-all 404 as the final ingress rule.
    local_posture: the day-to-day/local launcher posture stays NODE_ONE_PORT=8080 on
      127.0.0.1; the public-origin instance is booted with NODE_ONE_PORT=18080 for the
      demo window (same binary, same rails, different port - the F4 rail and every
      other guard apply identically there).
    post_cut_fingerprint: eom/endpoint-surface/cloudflared/verify-tunnel-fingerprint.sh
      MUST run after any cutover: it asserts the public hostname's /api/hello returns
      the node-one wire JSON (node=node-one, the pinned wire version, gate kinds) and
      FAILS on qBittorrent shapes - a 404 "Not Found" from the wrong origin is a
      hard failure, not a warning.
  token_custody:
    bridge_now: the machinery holds the capped temp token ON-BOX (DATA_DIR/admin-token.txt,
      mode 0600, or ADMIN_TOKEN in the operator environment) until the launcher+Y1 mint
      lands. Capped means scoped - it grants exactly the admin revert power, is never
      printed, never exported, never appears in data payloads, and is replaceable.
    target: the OWNER holds root on a hardware key (YubiKey; the Y1 hardware-signer
      seam - spike green 2026-08-13, HELD 2026-09-01, to be un-parked via the Seams
      launcher) and the machinery acts ONLY under bounded leases. The lease-over-root-key
      object (a bounded grant signed at mint by the hardware key, so machinery never
      holds root) is the documented target - a new-build prefigured by doorman leases
      and human-vouch-at-mint, never yet defined, buildable in the launcher. Written up
      in the node README custody section; when launcher+Y1 mint lands, the on-box 0600
      bridge token retires.
  export:
    visibility: PUBLIC (ruled 2026-10-26). The second node reads /api/export ungated;
      the only refusal that stands is the REQ-EXPORT-3 503 log_integrity gate.
